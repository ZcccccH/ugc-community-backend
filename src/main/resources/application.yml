server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ugc_community?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

app:
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      connect-timeout-seconds: ${DEEPSEEK_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${DEEPSEEK_READ_TIMEOUT_SECONDS:60}
  auth:
    # Contact-based password reset has no OTP; keep disabled unless you add verification
    contact-reset-enabled: ${PASSWORD_RESET_BY_CONTACT_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 604800
    header: Authorization
  security:
    # Only trust X-Forwarded-For when running behind your own reverse proxy
    trust-proxy: ${TRUST_PROXY:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    signature:
      enabled: ${API_SIGNATURE_ENABLED:false}
      public-key: ${API_SIGNATURE_PUBLIC_KEY:}
      max-skew-seconds: ${API_SIGNATURE_MAX_SKEW_SECONDS:300}
      nonce-ttl-seconds: ${API_SIGNATURE_NONCE_TTL_SECONDS:600}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:8}
      register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}
      upload-per-minute: ${RATE_LIMIT_UPLOAD_PER_MINUTE:10}
      publish-per-minute: ${RATE_LIMIT_PUBLISH_PER_MINUTE:6}
      comment-per-minute: ${RATE_LIMIT_COMMENT_PER_MINUTE:20}
      action-per-minute: ${RATE_LIMIT_ACTION_PER_MINUTE:60}
  upload:
    dir: ${UGC_UPLOAD_DIR:./uploads}
    url-prefix: /uploads/
    qiniu:
      enabled: ${QINIU_ENABLED:false}
      access-key: ${QINIU_ACCESS_KEY:}
      secret-key: ${QINIU_SECRET_KEY:}
      bucket: ${QINIU_BUCKET:}
      domain: ${QINIU_DOMAIN:}
      region: ${QINIU_REGION:auto}
      prefix: ${QINIU_PREFIX:uploads}
    compression:
      enabled: true
      image-enabled: true
      video-enabled: false
      image-max-long-edge: 2560
      image-quality: 0.82
      thumbnail-long-edge: 480
      long-image-width: 1440
      skip-image-size-kb: 500
      video-max-long-edge: 1280
      video-crf: 28
      video-worker-count: 1
      keep-original-backup-days: 7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.ugccommunity.backend: INFO
